name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_current:
        description: Publish the current package.json version to npm
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Publish current version
        if: github.event_name == 'workflow_dispatch' && inputs.publish_current
        run: npm publish --provenance --access public

      - name: Release
        if: github.event_name == 'push'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
